<style>
.elementor-location-header:has([data-id="5c8ec978"]) {
  --rb-header-admin: 0px;
  --rb-header-height: 72px;
  position: sticky;
  top: var(--rb-header-admin);
  margin-block-start: var(--rb-header-admin-extra, 0px);
  z-index: 1000;
  color: #15171c;
  background-color: #fdfdfc;
  transition: transform 240ms ease, background-color 240ms ease, color 240ms ease;
}
.elementor-location-header[data-rb-hidden] { transform: translateY(-100%); }
.elementor-location-header[data-rb-dark] { color: #fff; background-color: #15171c; }
[data-id="5c8ec978"] [data-id="798b0964"] {
  min-height: 72px;
  max-width: 1280px;
  margin-inline: auto;
  padding-inline: var(--rb-gutter, 24px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}
[data-id="5c8ec978"] :is(a, .elementor-menu-toggle):focus-visible {
  outline: 2px solid currentColor;
  outline-offset: 4px;
}
[data-id="5c8ec978"] [data-id="5cbdaac7"] { flex: none; color: inherit; }
[data-id="5c8ec978"] [data-id="1c829ac6"] svg { display: block; width: 100%; height: auto; }
[data-id="5c8ec978"] [data-id="1c829ac6"] svg path { fill: currentColor; }
[data-id="5c8ec978"] .elementor-nav-menu--main .elementor-item {
  min-height: 44px;
  padding: 4px 0;
  color: inherit;
  transition: opacity 220ms ease;
}
[data-id="5c8ec978"] .elementor-nav-menu--main .elementor-item:hover { opacity: .7; }
[data-id="5c8ec978"] .elementor-nav-menu .elementor-item[aria-current="page"],
[data-id="5c8ec978"] .elementor-nav-menu .current-menu-ancestor > a {
  text-decoration: underline;
  text-underline-offset: .3em;
}
[data-id="5c8ec978"] .elementor-nav-menu--main .rb-primary-contact > a {
  color: #fff; background: #15171c; padding-inline: 16px; border-radius: 4px;
}
[data-rb-dark] [data-id="5c8ec978"] .elementor-nav-menu--main .rb-primary-contact > a {
  color: #15171c; background: #fff;
}
@media (max-width: 767px) {
  html:has([data-rb-header-ready]) { scrollbar-gutter: stable; }
  [data-id="5c8ec978"] [data-id="798b0964"] { min-height: 60px; }
  .elementor-location-header[data-rb-header-ready] [data-id="5c8ec978"] [data-id="4bb36fef"],
  .elementor-location-header[data-rb-header-ready] [data-id="4bb36fef"] > .elementor-widget-container { position: static; }
  [data-id="5c8ec978"] .elementor-menu-toggle {
    position: relative;
    width: 48px;
    height: 48px;
    color: inherit;
    background: transparent;
    border: 0;
    border-radius: 4px;
  }
  [data-id="5c8ec978"] .elementor-menu-toggle > :is(svg, i) { visibility: hidden; }
  [data-id="5c8ec978"] .elementor-menu-toggle::before,
  [data-id="5c8ec978"] .elementor-menu-toggle::after {
    position: absolute;
    inset: 50% auto auto 50%;
    width: 22px;
    height: 2px;
    content: "";
    background: currentColor;
    transition: transform 240ms ease;
  }
  [data-id="5c8ec978"] .elementor-menu-toggle::before { transform: translate(-50%, -5px); }
  [data-id="5c8ec978"] .elementor-menu-toggle::after { transform: translate(-50%, 4px); }
  [data-id="5c8ec978"] .elementor-menu-toggle[aria-expanded="true"]::before { transform: translate(-50%, -50%) rotate(45deg); }
  [data-id="5c8ec978"] .elementor-menu-toggle[aria-expanded="true"]::after { transform: translate(-50%, -50%) rotate(-45deg); }
  [data-rb-header-ready] [data-id="5c8ec978"] nav.elementor-nav-menu--dropdown {
    position: absolute;
    inset: 100% 0 auto;
    width: 100%;
    max-height: calc(100dvh - var(--rb-header-height) - var(--rb-header-admin)) !important;
    margin: 0 !important;
    padding: 8px var(--rb-gutter, 24px) 24px;
    overflow: auto;
    overscroll-behavior: contain;
    background: #15171c;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: translateY(-8px);
    transition: opacity 240ms ease, transform 240ms ease, visibility 240ms;
  }
  [data-rb-header-ready][data-rb-menu-open] [data-id="5c8ec978"] nav.elementor-nav-menu--dropdown {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transform: none;
  }
  [data-rb-header-ready] [data-id="5c8ec978"] nav.elementor-nav-menu--dropdown .elementor-item {
    min-height: 54px;
    padding: 12px 4px;
    color: #fff;
    background: transparent;
    border-bottom: 1px solid #ffffff26;
    font: 600 clamp(20px, 5vw, 26px)/1.3 Manrope, sans-serif;
  }
  [data-rb-header-ready] [data-id="5c8ec978"] nav.elementor-nav-menu--dropdown .elementor-item:hover { background: #ffffff12; }
  html[data-rb-header-menu-lock] { overflow: hidden; }
}
@media (prefers-reduced-motion: reduce) {
  .elementor-location-header:has([data-id="5c8ec978"]),
  [data-id="5c8ec978"] *::before,
  [data-id="5c8ec978"] *::after,
  [data-rb-header-ready] [data-id="5c8ec978"] nav.elementor-nav-menu--dropdown { transition: none !important; }
}
@media (min-width: 768px) {
  [data-id="5c8ec978"] [data-id="4bb36fef"] .elementor-nav-menu--main > .elementor-nav-menu {
    block-size: 44px;
    align-content: center;
    align-items: center;
  }
  [data-id="5c8ec978"] [data-id="4bb36fef"] .elementor-nav-menu--main li:not(.rb-primary-contact) > a.elementor-item {
    position: relative;
    padding: 4px 0;
    color: inherit;
    opacity: 1;
    font-family: var(--rb-font, Manrope), sans-serif;
    font-size: 16px;
    font-weight: 500;
    letter-spacing: normal;
    text-transform: none;
    text-decoration: none;

    &::after {
      position: absolute;
      inset-inline: 0;
      inset-block-end: 8px;
      block-size: 1px;
      display: block;
      content: "";
      background: currentColor;
      opacity: 1;
      pointer-events: none;
      transform: scaleX(0);
      transform-origin: left center;
      transition: transform 200ms ease;
    }
    &:is(:hover, :focus-visible, [aria-current="page"], .current-menu-ancestor > .elementor-item)::after {
      transform: scaleX(1);
    }
    @media (prefers-reduced-motion: reduce) {
      &::after { transition: none; }
    }
  }
}
</style>
<script>
(() => {
  const install = () => {
(() => {
  const shell = document.querySelector('[data-id="5c8ec978"]');
  const header = shell?.closest('.elementor-location-header');
  const toggle = shell?.querySelector('.elementor-menu-toggle');
  const mobileMenu = shell?.querySelector('nav.elementor-nav-menu--dropdown');
  if (!header || !toggle || !mobileMenu || header.hasAttribute('data-rb-header-ready')) return;
  if (document.body.classList.contains('elementor-editor-active')) return;

  const root = document.documentElement;
  const admin = document.getElementById('wpadminbar');
  const mobile = matchMedia('(max-width: 767px)');
  const adminItems = [...(admin?.querySelectorAll('.ab-top-menu > li > .ab-item') || [])];
  let previousY = Math.max(0, scrollY);
  let direction = 0;
  let distance = 0;
  let hidden = false;
  let dark = previousY > 12;
  let frame = 0;
  let menuOpen = false;
  let returnFocus = false;

  const apply = () => {
    header.toggleAttribute('data-rb-hidden', hidden && !menuOpen);
    header.toggleAttribute('data-rb-dark', dark || menuOpen);
    if (admin) {
      const bounds = admin.getBoundingClientRect();
      const bottoms = adminItems.filter(item => item.getClientRects().length).map(item => item.getBoundingClientRect().bottom);
      const bottom = Math.max(bounds.bottom, ...bottoms);
      header.style.setProperty('--rb-header-admin', `${Math.max(0, bottom)}px`);
      header.style.setProperty('--rb-header-admin-extra', `${Math.max(0, bottom - bounds.bottom)}px`);
    }
  };

  const update = () => {
    frame = 0;
    const y = Math.max(0, Math.min(scrollY, root.scrollHeight - innerHeight));
    const delta = y - previousY;
    const nextDirection = Math.sign(delta);
    if (nextDirection && nextDirection !== direction) {
      direction = nextDirection;
      distance = 0;
    }
    distance += delta;
    previousY = y;

    if (y <= 12) {
      hidden = dark = false;
      distance = 0;
    } else if (menuOpen || (shell.contains(document.activeElement) && document.activeElement.matches(':focus-visible'))) {
      hidden = false;
      distance = 0;
    } else if (y > Math.max(88, header.offsetHeight) && distance > 28) {
      hidden = true;
    } else if (distance < -15) {
      hidden = false;
      dark = true;
    }
    apply();
  };

  const schedule = () => {
    if (!frame) frame = requestAnimationFrame(update);
  };

  function syncMenu() {
    menuOpen = mobile.matches && toggle.getAttribute('aria-expanded') === 'true';
    header.toggleAttribute('data-rb-menu-open', menuOpen);
    root.toggleAttribute('data-rb-header-menu-lock', menuOpen);
    toggle.setAttribute('aria-label', menuOpen ? 'Close menu' : 'Open menu');
    if (menuOpen) hidden = false;
    if (!menuOpen && returnFocus) {
      returnFocus = false;
      toggle.focus({preventScroll: true});
    }
    apply();
    schedule();
  }

  function closeMenu(restoreFocus) {
    if (!menuOpen) return;
    returnFocus = restoreFocus;
    if (toggle.getAttribute('aria-expanded') === 'true') toggle.click();
    syncMenu();
  }

  document.addEventListener('keydown', event => {
    if (!menuOpen) return;
    if (event.key === 'Escape') {
      event.preventDefault();
      event.stopPropagation();
      closeMenu(true);
      return;
    }
    if (event.key !== 'Tab') return;
    const focusable = [...shell.querySelectorAll('a[href], .elementor-menu-toggle')]
      .filter(node => node.getClientRects().length && getComputedStyle(node).visibility === 'visible');
    const first = focusable[0];
    const last = focusable.at(-1);
    if (!first || !last) return;
    if (event.shiftKey && (document.activeElement === first || !shell.contains(document.activeElement))) {
      event.preventDefault();
      last.focus();
    } else if (!event.shiftKey && (document.activeElement === last || !shell.contains(document.activeElement))) {
      event.preventDefault();
      first.focus();
    }
  }, true);

  shell.addEventListener('click', event => {
    const link = event.target.closest('a[href]');
    if (link && menuOpen) closeMenu(false);
  });
  mobile.addEventListener('change', () => {
    if (!mobile.matches && toggle.getAttribute('aria-expanded') === 'true') toggle.click();
    syncMenu();
  });
  new MutationObserver(syncMenu).observe(toggle, {attributes: true, attributeFilter: ['aria-expanded']});
  new ResizeObserver(() => {
    header.style.setProperty('--rb-header-height', `${header.offsetHeight}px`);
    schedule();
  }).observe(header);
  window.addEventListener('scroll', schedule, {passive: true});
  window.addEventListener('resize', schedule, {passive: true});
  window.addEventListener('pageshow', schedule);
  shell.addEventListener('focusin', () => {
    hidden = false;
    apply();
    schedule();
  });
  header.setAttribute('data-rb-header-ready', '');
  syncMenu();
})();
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', install, {once:true});
  else install();
})();
</script>
